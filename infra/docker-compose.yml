services:
    postgres:
        image: postgres:17-alpine
        container_name: messenger-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: messenger
            POSTGRES_PASSWORD: messenger_dev_password
            POSTGRES_DB: messenger
        ports:
            - "5433:5432"
        volumes:
            - postgres_data:/var/lib/postgresql/data
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U messenger -d messenger"]
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres_data:
